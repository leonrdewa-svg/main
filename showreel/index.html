<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Reel 2026</title>
<style>
@font-face{font-family:Anton;src:url(fonts/anton.woff2) format('woff2')}
@font-face{font-family:Bebas;src:url(fonts/bebas.woff2) format('woff2')}
@font-face{font-family:Dela;src:url(fonts/dela.woff2) format('woff2')}
@font-face{font-family:Potta;src:url(fonts/potta.woff2) format('woff2')}
html,body{margin:0;height:100%;background:#000}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:system-ui,sans-serif}
canvas{height:100vh;max-width:100vw;aspect-ratio:9/16;display:block;background:#000}
#ui{position:fixed;left:0;right:0;bottom:12px;display:flex;gap:10px;justify-content:center;align-items:center;color:#fff;font-size:13px;opacity:.85}
#ui button{background:#e8173a;color:#fff;border:0;padding:8px 16px;font-weight:700;border-radius:4px;cursor:pointer}
#ui input{width:40vw}
body.render #ui{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><button id="play">PLAY</button><input id="seek" type="range" min="0" max="30" step="0.001" value="0"><span id="tc">0.00s</span></div>
<script>
/* =====================================================================
   MOTION REEL 2026 — procedural 2D anime showreel, 1080x1920 @ 30fps, 30s
   Every frame is a pure function of time: render(t).
   ===================================================================== */
const W=1080,H=1920,FPS=30,DUR=30,TAU=Math.PI*2,PI=Math.PI;
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const X=cv.getContext('2d');

/* ---------------- math / timing ---------------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,x)=>clamp((x-a)/(b-a));
const step=(t,f=12)=>Math.floor(t*f+1e-6)/f;           // "on twos" = 12 drawings/sec
const E={
  lin:t=>t, inQ:t=>t*t, outQ:t=>1-(1-t)*(1-t),
  inC:t=>t*t*t, outC:t=>1-Math.pow(1-t,3), ioC:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  outQuint:t=>1-Math.pow(1-t,5),
  inExpo:t=>t<=0?0:Math.pow(2,10*t-10), outExpo:t=>t>=1?1:1-Math.pow(2,-10*t),
  ioExpo:t=>t<=0?0:t>=1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2,
  outBack:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  outBack2:t=>{const c1=3.2,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  outElastic:t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*TAU/3)+1,
  ioSine:t=>-(Math.cos(PI*t)-1)/2,
};
function rng(seed){let s=seed>>>0||1;return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash1(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function noise(x,seed=0){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash1(i+seed*57.31),hash1(i+1+seed*57.31),u)*2-1}
const V=(a,l=1)=>[Math.sin(a)*l,Math.cos(a)*l];       // angle 0 = straight down
const add=(a,b,k=1)=>[a[0]+b[0]*k,a[1]+b[1]*k];
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];

/* ---------------- palette ---------------- */
const C={ink:'#0a0710',paper:'#f4ede0',red:'#e8173a',crim:'#b30d2d',orange:'#ff6a1a',gold:'#ffd23f',
  cyan:'#39e6ff',blue:'#2856ff',navy:'#0d1030',violet:'#2a0b45',white:'#ffffff',pink:'#ff7aa8'};

/* ---------------- global per-frame FX state ---------------- */
let FX;
function resetFX(){FX={hud:true,hudCol:'#fff',label:'',ca:0,grain:1,vig:1}}

/* ---------------- drawing helpers ---------------- */
function T(c,s,x,y,o={}){
  c.save();c.font=`${o.s||100}px ${o.f||'Anton'}`;c.textAlign=o.al||'center';c.textBaseline=o.bl||'middle';
  c.letterSpacing=(o.ls||0)+'px';c.translate(x,y);if(o.rot)c.rotate(o.rot);
  if(o.sx!=null||o.sy!=null)c.scale(o.sx??1,o.sy??1);if(o.skew)c.transform(1,0,o.skew,1,0,0);
  if(o.a!=null)c.globalAlpha*=o.a;
  if(o.ca){c.fillStyle='#ff1744';c.fillText(s,-o.ca,0);c.fillStyle='#18e0ff';c.fillText(s,o.ca,0)}
  if(o.shadow){c.fillStyle=o.shadow;c.fillText(s,o.sdx??12,o.sdy??12)}
  if(o.sw){c.lineJoin='round';c.lineWidth=o.sw;c.strokeStyle=o.sc||C.ink;c.strokeText(s,0,0)}
  if(o.c!==null){c.fillStyle=o.c||'#fff';c.fillText(s,0,0)}
  c.restore();
}
function TV(c,s,x,y,o={}){const ch=[...s],lh=(o.s||100)*(o.lh||1.02);ch.forEach((k,i)=>T(c,k,x,y+i*lh,o))}
function glow(c,x,y,r,col,a=1){if(a<=0||r<=0)return;c.save();c.globalCompositeOperation='lighter';c.globalAlpha=clamp(a);
  const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);c.restore()}
function circle(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,Math.max(0,r),0,TAU);c.fill()}
function poly(c,pts,col){c.fillStyle=col;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fill()}

// 集中線 focus lines — flicker on twos
function focusLines(c,cx,cy,o={}){
  const r=rng((o.seed||1)*977+Math.floor((o.t||0)*(o.fps||12))*31);
  const n=o.count||120,inner=o.inner||300,outer=o.outer||2400,w=o.w||[0.004,0.018];
  c.save();c.fillStyle=o.color||'#fff';c.globalAlpha*=o.alpha??1;c.beginPath();
  for(let i=0;i<n;i++){const a=r()*TAU,ww=lerp(w[0],w[1],r()),ri=inner*(0.65+r()*0.7);
    c.moveTo(cx+Math.cos(a)*ri,cy+Math.sin(a)*ri);
    c.lineTo(cx+Math.cos(a-ww)*outer,cy+Math.sin(a-ww)*outer);
    c.lineTo(cx+Math.cos(a+ww)*outer,cy+Math.sin(a+ww)*outer);c.closePath()}
  c.fill();c.restore();
}
// 流線 parallel speed lines travelling along angle ang
function speedLines(c,ang,t,o={}){
  const r=rng(o.seed||7),n=o.count||60,D=2800,len=o.len||[200,900],w=o.w||[2,6],sp=o.speed||3000;
  c.save();c.translate(W/2,H/2);c.rotate(ang);c.fillStyle=o.color||'#fff';
  for(let i=0;i<n;i++){const y=(r()-.5)*D,l=lerp(len[0],len[1],r()),ww=lerp(w[0],w[1],r()),s=sp*(0.6+r()*0.8);
    const x=((r()*D+t*s)%(D+l))-D/2-l;c.globalAlpha=(o.alpha??0.6)*(0.25+r()*0.75);c.fillRect(x,y-ww/2,l,ww)}
  c.restore();
}
// jagged impact burst
function burst(c,cx,cy,seed,col,n,ro,ri,rot=0){const r=rng(seed);c.beginPath();
  for(let i=0;i<n*2;i++){const a=rot+i/(n*2)*TAU+(r()-.5)*0.12,rad=i%2?lerp(ri[0],ri[1],r()):lerp(ro[0],ro[1],r());
    const p=[cx+Math.cos(a)*rad,cy+Math.sin(a)*rad];i?c.lineTo(...p):c.moveTo(...p)}
  c.closePath();c.fillStyle=col;c.fill()}
// cel-shaded cloud/smoke blob: hard-edged highlight bands, no gradients
function celBlob(c,x,y,r,seed,cols,light=[-0.55,-0.75],outline){
  if(r<=1)return;const rr=rng(seed),cs=[[0,0,r]];
  for(let i=0;i<6;i++){const a=rr()*TAU,d=r*(0.35+rr()*0.45);cs.push([Math.cos(a)*d,Math.sin(a)*d,r*(0.42+rr()*0.35)])}
  const path=(dx,dy,s)=>{c.beginPath();for(const q of cs){const px=x+q[0]*s+dx,py=y+q[1]*s+dy;c.moveTo(px+q[2]*s,py);c.arc(px,py,q[2]*s,0,TAU)}};
  c.save();
  if(outline){path(0,0,1);c.lineWidth=outline;c.strokeStyle=C.ink;c.stroke()}
  path(0,0,1);c.fillStyle=cols[0];c.fill();c.clip();
  path(light[0]*r*0.32,light[1]*r*0.32,0.93);c.fillStyle=cols[1];c.fill();
  if(cols[2]){path(light[0]*r*0.62,light[1]*r*0.62,0.8);c.fillStyle=cols[2];c.fill()}
  c.restore();
}
// lightning via midpoint displacement
function boltPts(x1,y1,x2,y2,seed,disp=120,depth=6){const r=rng(seed);let pts=[[x1,y1],[x2,y2]];
  for(let d=0;d<depth;d++){const np=[pts[0]];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,o=(r()-.5)*disp;
    np.push([(a[0]+b[0])/2-dy/L*o,(a[1]+b[1])/2+dx/L*o],b)}pts=np;disp*=0.55}return pts}
function drawBolt(c,pts,col,w){c.save();c.globalCompositeOperation='lighter';c.lineJoin='round';c.lineCap='round';
  const path=()=>{c.beginPath();pts.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p))};
  c.strokeStyle=col;c.globalAlpha=0.22;c.lineWidth=w*7;path();c.stroke();c.globalAlpha=0.7;c.lineWidth=w*2.4;path();c.stroke();
  c.globalAlpha=1;c.strokeStyle='#fff';c.lineWidth=w;path();c.stroke();c.restore()}
// crescent slash
function crescent(c,cx,cy,R,a0,a1,thick,col,core='#fff'){
  const N=48,pts=[];for(let k=0;k<=N;k++){const a=lerp(a0,a1,k/N);pts.push([cx+Math.cos(a)*R,cy+Math.sin(a)*R])}
  for(let k=N;k>=0;k--){const a=lerp(a0,a1,k/N),w=thick*Math.pow(Math.sin(PI*k/N),0.8)*(0.4+0.6*k/N);pts.push([cx+Math.cos(a)*(R-w),cy+Math.sin(a)*(R-w)])}
  c.save();c.globalCompositeOperation='lighter';c.globalAlpha=0.35;c.shadowColor=col;
  c.lineWidth=40;c.strokeStyle=col;c.lineJoin='round';c.beginPath();pts.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.stroke();c.restore();
  poly(c,pts,col);
  const p2=[];for(let k=0;k<=N;k++){const a=lerp(a0,a1,k/N);p2.push([cx+Math.cos(a)*R,cy+Math.sin(a)*R])}
  for(let k=N;k>=0;k--){const a=lerp(a0,a1,k/N),w=thick*0.45*Math.pow(Math.sin(PI*k/N),0.8)*(0.4+0.6*k/N);p2.push([cx+Math.cos(a)*(R-w),cy+Math.sin(a)*(R-w)])}
  poly(c,p2,core);
}
// camera helper: zoom/rotate about a point, with shake, overscanned so edges never show
function camera(c,t,o){const sh=o.shake||0,z=(o.zoom||1)*(1+sh*2.4/W);
  c.translate(W/2+noise(t*38,1)*sh+(o.dx||0),H/2+noise(t*38,2)*sh+(o.dy||0));c.rotate(o.rot||0);c.scale(z,z);c.translate(-(o.cx??W/2),-(o.cy??H/2))}

/* ---------------- the hero: a jointed puppet drawn as a cel silhouette ---------------- */
const POSE={
  stand:{tor:0,head:0,lsh:-0.16,lel:0.05,rsh:0.16,rel:-0.05,lhip:-0.09,lkn:0.02,rhip:0.09,rkn:-0.02},
  crouch:{tor:0.05,head:0.1,lsh:-0.55,lel:0.5,rsh:0.55,rel:-0.5,lhip:-1.05,lkn:1.75,rhip:1.05,rkn:-1.75},
  leap:{tor:0.25,head:0.15,lsh:-0.7,lel:-0.5,rsh:2.9,rel:0.15,lhip:-0.2,lkn:0.55,rhip:1.4,rkn:-2.0},
  kick:{tor:-0.55,head:-0.2,lsh:-1.9,lel:-0.7,rsh:1.2,rel:1.0,lhip:0.15,lkn:0.35,rhip:2.3,rkn:0.05},
  tuck:{tor:0,head:0.3,lsh:-1.1,lel:1.9,rsh:1.1,rel:-1.9,lhip:-2.2,lkn:2.5,rhip:2.2,rkn:-2.5},
  dive:{tor:0,head:0,lsh:2.7,lel:0.1,rsh:-2.9,rel:0.05,lhip:-0.12,lkn:0.25,rhip:0.18,rkn:0.4},
  power:{tor:0,head:0,lsh:-0.6,lel:0.55,rsh:0.6,rel:-0.55,lhip:-0.3,lkn:0.14,rhip:0.3,rkn:-0.14},
  charge:{tor:0,head:0.05,lsh:-0.32,lel:2.55,rsh:0.32,rel:-2.55,lhip:-0.32,lkn:0.16,rhip:0.32,rkn:-0.16},
  fire:{tor:0,head:0,lsh:2.95,lel:0.12,rsh:-2.95,rel:-0.12,lhip:-0.38,lkn:0.2,rhip:0.38,rkn:-0.2},
  slash:{tor:0.2,head:0,lsh:2.3,lel:0.3,rsh:-1.2,rel:-0.6,lhip:-0.5,lkn:0.9,rhip:0.9,rkn:-1.4},
};
function lp(a,b,t){const o={};for(const k in a)o[k]=lerp(a[k],b[k]??a[k],t);return o}
function heroJ(p){
  const s=p.s,tor=(p.tor||0)+(p.rot||0),P=[p.x,p.y];
  const up=[-Math.sin(tor),-Math.cos(tor)],pr=[Math.cos(tor),-Math.sin(tor)];
  const chest=add(P,up,108*s),neck=add(P,up,126*s),head=add(neck,V(tor+PI+(p.head||0)),34*s);
  const shL=add(chest,pr,-36*s),shR=add(chest,pr,36*s),hipL=add(P,pr,-17*s),hipR=add(P,pr,17*s);
  const elL=add(shL,V(tor+p.lsh),70*s),haL=add(elL,V(tor+p.lsh+p.lel),64*s);
  const elR=add(shR,V(tor+p.rsh),70*s),haR=add(elR,V(tor+p.rsh+p.rel),64*s);
  const knL=add(hipL,V(tor+p.lhip),88*s),ftL=add(knL,V(tor+p.lhip+p.lkn),88*s);
  const knR=add(hipR,V(tor+p.rhip),88*s),ftR=add(knR,V(tor+p.rhip+p.rkn),88*s);
  return {P,s,tor,up,pr,chest,neck,head,shL,shR,hipL,hipR,elL,haL,elR,haR,knL,ftL,knR,ftR,down:V(tor)};
}
function groundTo(p,gy){const J=heroJ(p);const m=Math.max(J.ftL[1],J.ftR[1])+14*p.s;return {...p,y:p.y+(gy-m)}}
function heroBody(c,J,col,o){
  const s=J.s,t=o.t||0,wind=o.wind||[0,0];
  c.fillStyle=col;c.strokeStyle=col;c.lineCap='round';c.lineJoin='round';
  const seg=(a,b,w)=>{c.lineWidth=w*s;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke()};
  // long coat
  if(o.coat!==false){const hem=[],N=7;
    for(let k=0;k<=N;k++){const u=k/N,edge=Math.abs(u-.5)*2;
      const base=add(add(J.P,J.pr,lerp(48,-48,u)*s),J.down,(125+18*Math.sin(k*1.7))*s);
      const fl=(0.55+0.45*Math.sin(t*17+k*1.25))*(0.4+edge*0.8);
      hem.push(add(base,wind,fl*s*(0.9+0.3*noise(t*4+k))))}
    const pts=[add(J.shR,J.pr,-4*s),add(J.hipR,J.pr,14*s),...hem,add(J.hipL,J.pr,-14*s),add(J.shL,J.pr,4*s)];
    c.beginPath();pts.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.fill()}
  seg(J.hipL,J.knL,34);seg(J.knL,J.ftL,27);seg(J.hipR,J.knR,34);seg(J.knR,J.ftR,27);
  circle(c,...add(J.ftL,J.down,4*s),16*s,col);circle(c,...add(J.ftR,J.down,4*s),16*s,col);
  c.beginPath();[add(J.shL,J.pr,-6*s),add(J.shR,J.pr,6*s),add(J.hipR,J.pr,9*s),add(J.hipL,J.pr,-9*s)].forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.fill();
  seg(J.chest,J.neck,26);
  seg(J.shL,J.elL,27);seg(J.elL,J.haL,22);seg(J.shR,J.elR,27);seg(J.elR,J.haR,22);
  circle(c,...J.haL,17*s,col);circle(c,...J.haR,17*s,col);
  if(o.sword){const d=[J.haR[0]-J.elR[0],J.haR[1]-J.elR[1]],L=Math.hypot(...d),u=[d[0]/L,d[1]/L],n=[-u[1],u[0]];
    const tip=add(J.haR,u,210*s);c.beginPath();c.moveTo(...add(J.haR,n,6*s));c.lineTo(...add(tip,n,1*s));c.lineTo(...add(tip,n,-5*s));c.lineTo(...add(J.haR,n,-6*s));c.closePath();c.fill()}
  // head + spiky hair
  circle(c,...J.head,31*s,col);
  const hr=rng(o.hairSeed||5),hu=[J.head[0]-J.neck[0],J.head[1]-J.neck[1]],hl=Math.hypot(...hu),hup=[hu[0]/hl,hu[1]/hl];
  const rot=(v,a)=>[v[0]*Math.cos(a)-v[1]*Math.sin(a),v[0]*Math.sin(a)+v[1]*Math.cos(a)];
  c.beginPath();const K=9;
  for(let k=0;k<=K;k++){const a=lerp(-2.05,2.05,k/K),L=(o.hairLen||1)*(26+hr()*34)*(1-Math.abs(a)*0.18);
    const b=add(J.head,rot(hup,a-0.2),27*s),tip=add(add(J.head,rot(hup,a*1.08),(31+L)*s),wind,(L/40)*0.55*s*(1+0.3*noise(t*9+k)));
    k?c.lineTo(...b):c.moveTo(...b);c.lineTo(...tip)}
  c.lineTo(...add(J.head,rot(hup,2.2),26*s));c.closePath();c.fill();
}
function scarf(c,J,o){
  const s=J.s,t=o.t||0,wind=o.wind||[0,0],ws=Math.min(1,Math.hypot(...wind)/60);
  const base=Math.atan2(wind[1],wind[0]||1e-6);
  const tail=(len,ph,w0)=>{const N=26,seg=len*s/N;let p=add(J.neck,J.up,-4*s),L=[],R=[];
    for(let i=0;i<=N;i++){const u=i/N;
      let a=lerp(PI/2,base,ws)+Math.sin(t*(o.freq||11)-i*0.42+ph)*0.5*u*(0.4+ws)+ (1-ws)*0.3*u;
      const w=lerp(w0,w0*0.45,u)*s*(1+0.25*Math.sin(t*14-i*0.6+ph)),n=[-Math.sin(a),Math.cos(a)];
      L.push(add(p,n,w/2));R.push(add(p,n,-w/2));p=add(p,[Math.cos(a),Math.sin(a)],seg)}
    const pts=[...L,...R.reverse()];poly(c,pts,o.col||C.red);
    c.save();c.globalAlpha=0.35;poly(c,[...L.slice(4).map((q,i)=>q),...L.slice(4).reverse().map((q,i)=>add(q,[0,1],6*s))],'#000');c.restore()};
  tail((o.len||300)*0.62,1.7,22);tail(o.len||300,0,26);
  c.fillStyle=o.col||C.red;c.beginPath();c.ellipse(...J.neck,30*s,16*s,-J.tor,0,TAU);c.fill();
}
function drawHero(c,p,o={}){
  const J=heroJ(p);
  if(o.after){for(const a of o.after){c.save();c.globalAlpha=a.alpha;c.translate(a.dx,a.dy);heroBody(c,J,a.col,o);c.restore()}}
  if(o.rim){c.save();c.translate(...o.rimOff||[-5,-3]);heroBody(c,J,o.rim,o);if(o.scarf)scarf(c,J,{...o,col:o.rim});c.restore()}
  heroBody(c,J,o.col||C.ink,o);
  if(o.scarf)scarf(c,J,{...o,col:o.scarfCol||C.red});
  if(o.eyes){const e=J.head,s=J.s;[-1,1].forEach(k=>{const ep=add(add(e,J.pr,k*11*s),J.up,-3*s);
    c.save();c.fillStyle='#fff';c.beginPath();c.ellipse(ep[0],ep[1],8*s,2.8*s,-J.tor+k*0.25,0,TAU);c.fill();c.restore();
    glow(c,ep[0],ep[1],50*s*o.eyes,o.eyeCol||C.cyan,0.9)})}
  return J;
}

/* ---------------- pre-baked textures ---------------- */
function mk(w,h){const k=document.createElement('canvas');k.width=w;k.height=h;return k}

  const fo=inv(3.2,3.5,t);if(fo>0){c.fillStyle=`rgba(0,0,0,${fo})`;c.fillRect(0,0,W,H)}
  FX.ca=Math.exp(-Math.max(0,t-0.45)*8)*(t>0.45?10:0);
}

/* ---------------- transitions & post ---------------- */
function barsWipe(c,p){const n=8,bh=3200/n;c.save();c.translate(W/2,H/2);c.rotate(-0.38);
  for(let i=0;i<n;i++){const d=i*0.035,a=E.outExpo(clamp((p-d)/0.42)),b=E.inExpo(clamp((p-0.5-d)/0.42));
    const L=-1700+3400*b,R=-1700+3400*a;if(R>L){c.fillStyle=i%3===1?C.red:C.ink;c.fillRect(L,-1600+i*bh,R-L,bh+2)}}c.restore()}
function chroma(c,amt){if(amt<0.5)return;const d=Math.round(amt);
  BG.globalCompositeOperation='copy';BG.drawImage(cv,0,0);BG.globalCompositeOperation='multiply';BG.fillStyle='#f00';BG.fillRect(0,0,W,H);
  BG2.globalCompositeOperation='copy';BG2.drawImage(cv,0,0);BG2.globalCompositeOperation='multiply';BG2.fillStyle='#0ff';BG2.fillRect(0,0,W,H);
  c.save();c.globalCompositeOperation='copy';c.drawImage(BUF,-d,0);c.globalCompositeOperation='lighter';c.drawImage(BUF2,d,0);c.restore()}
function hud(c,t){if(!FX.hud)return;c.save();const col=FX.hudCol;c.globalAlpha=0.85;
  T(c,'CLAUDE / MOTION REEL 2026',64,86,{f:'Bebas',s:38,al:'left',ls:4,c:col});
  const f=Math.floor(t*FPS+1e-6),pad=n=>String(n).padStart(2,'0');
  T(c,`${pad(Math.floor(f/FPS))}:${pad(f%FPS)}`,W-64,86,{f:'Bebas',s:38,al:'right',ls:4,c:col});
  if(Math.floor(t*2)%2===0)circle(c,W-190,84,9,C.red);
  c.strokeStyle=col;c.lineWidth=4;const m=34,l=46;
  [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,sx,sy])=>{c.beginPath();c.moveTo(x,y+sy*l);c.lineTo(x,y);c.lineTo(x+sx*l,y);c.stroke()});
  T(c,FX.label,64,H-86,{f:'Bebas',s:34,al:'left',ls:5,c:col});
  c.fillStyle=col;c.globalAlpha=0.3;c.fillRect(W-364,H-90,300,5);c.globalAlpha=0.9;c.fillRect(W-364,H-90,300*(t/DUR),5);
  c.restore()}
function post(c,t){
  chroma(c,FX.ca);
  if(FX.vig>0){c.save();c.globalAlpha=FX.vig;c.drawImage(VIG,0,0);c.restore()}
  c.save();c.globalCompositeOperation='overlay';c.globalAlpha=0.13*FX.grain;c.imageSmoothingEnabled=false;c.drawImage(GRAIN[Math.floor(t*24)%4],0,0,W,H);c.restore();
}

const SCENES=[[0,2,sEye],[2,4,sTitle],[4,8,sRoof],[8,12,sDash],[12,16,sClash],[16,20,sPanels],[20,24,sPower],[24,26.5,sBeam],[26.5,30.01,sEnd]];
function render(t){
  resetFX();
  X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;X.globalCompositeOperation='source-over';
  const sc=SCENES.find(s=>t>=s[0]&&t<s[1])||SCENES[SCENES.length-1];
  X.save();sc[2](X,t-sc[0],t);X.restore();
  if(t>3.72&&t<4.3)barsWipe(X,inv(3.72,4.3,t));
  post(X,t);hud(X,t);
}
window.renderFrame=i=>render(i/FPS);

/* ---------------- boot ---------------- */
const RENDER=location.search.includes('render');
if(RENDER)document.body.classList.add('render');
window.ready=(async()=>{
  const fam=['Anton','Bebas','Dela','Potta'];
  await Promise.all(fam.map(f=>document.fonts.load(`100px ${f}`,f==='Dela'||f==='Potta'?'動覚醒ド':'A').catch(()=>{})));
  await document.fonts.ready;render(0);return true})();
if(!RENDER){
  const btn=document.getElementById('play'),seek=document.getElementById('seek'),tc=document.getElementById('tc');
  const audio=new Audio('reel.wav');let playing=false,t0=0,start=0;
  const now=()=>playing?(audio.readyState>2&&!audio.paused?audio.currentTime:(performance.now()-start)/1000+t0):t0;
  function loop(){const t=Math.min(DUR-1e-3,now());render(t);seek.value=t;tc.textContent=t.toFixed(2)+'s';
    if(playing&&t>=DUR-0.01){playing=false;btn.textContent='PLAY';t0=0}if(playing)requestAnimationFrame(loop)}
  btn.onclick=()=>{if(playing){t0=now();playing=false;audio.pause();btn.textContent='PLAY'}else{playing=true;start=performance.now();audio.currentTime=t0;audio.play().catch(()=>{});btn.textContent='PAUSE';loop()}};
  seek.oninput=()=>{t0=+seek.value;if(playing){start=performance.now();audio.currentTime=t0}else{render(t0);tc.textContent=t0.toFixed(2)+'s'}};
  window.ready.then(()=>render(0));
}
</script>
